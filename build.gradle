plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.21'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}

	maven {
		name 'Xander Maven'
		url 'https://maven.isxander.dev/releases'
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation("dev.isxander:yet-another-config-lib:${project.yaclversion}")
	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
	runtimeOnly "net.fabricmc:fabric-language-kotlin:${project.kotlin_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Development-only client integration tests; never included in the distributable JAR.
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        walksycustomhitboxes { sourceSet sourceSets.main }
        customhitboxes_smoke { sourceSet sourceSets.smokeTest }
    }
    runs {
        smokeTest {
            client()
            source sourceSets.smokeTest
            runDir 'run-smoke'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.testModResourcesPath=src/smokeTest/resources'
        }
    }
}


// Collect installable mods, including YACL's Kotlin runtime, without sources JARs.
tasks.register('collectRuntimeMods', Copy) {
    from providers.provider {
        configurations.runtimeClasspath.files.findAll { file ->
            file.name in [
                "fabric-api-${project.fabric_version}.jar",
                "yet-another-config-lib-${project.yaclversion}.jar",
                "modmenu-${project.modmenu_version}.jar",
                "fabric-language-kotlin-${project.kotlin_version}.jar"
            ].collect { it.toString() }
        }
    }
    into layout.buildDirectory.dir('runtime-mods')
}

// Exercise the distributable from mods/, without development classes or dependency
// classpaths masking a missing runtime mod or bundled library.
sourceSets {
    artifactSmoke {
        runtimeClasspath = sourceSets.smokeTest.output + sourceSets.main.runtimeClasspath.filter { file ->
            !sourceSets.main.output.files.contains(file) &&
                !(file.name.startsWith('fabric-') && !file.name.startsWith('fabric-loader-') &&
                    !file.name.startsWith('fabric-log4j-util-') &&
                    !file.name.startsWith('fabric-client-gametest-api-v1-') &&
                    !file.name.startsWith('fabric-gametest-api-v1-')) &&
                !file.name.startsWith('yet-another-config-lib-') &&
                !file.name.startsWith('modmenu-') && !file.name.startsWith('placeholder-api-') &&
                !file.name.startsWith('kotlin-') && !file.name.startsWith('kotlinx-') &&
                !file.name.startsWith('atomicfu-') &&
                !file.path.contains('/com.twelvemonkeys.') &&
                !file.path.contains('/org.quiltmc.parsers/')
        }
    }
}
loom {
    runs {
        artifactSmoke {
            client()
            source sourceSets.artifactSmoke
            runDir 'run-artifact-smoke'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.testModResourcesPath=src/smokeTest/resources'
        }
    }
}
tasks.register('prepareArtifactSmoke', Sync) {
    dependsOn tasks.named('jar'), tasks.named('collectRuntimeMods'), tasks.named('smokeTestClasses')
    from tasks.named('jar').flatMap { it.archiveFile }
    from layout.buildDirectory.dir('runtime-mods')
    into layout.projectDirectory.dir('run-artifact-smoke/mods')
}
tasks.named('runArtifactSmoke').configure {
    dependsOn tasks.named('prepareArtifactSmoke')
}
